version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/venv
      - /app/__pycache__
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DATABASE_URL=sqlite:///./test.db

  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile
    volumes:
      - ./frontend_nextjs:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend_nextjs/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
